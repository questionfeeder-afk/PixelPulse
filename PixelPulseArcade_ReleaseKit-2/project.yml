name: PixelPulseArcade
options:
  bundleIdPrefix: com.pixelpulse
  deploymentTarget:
    macOS: "13.0"
targets:
  PixelPulseArcade:
    type: application
    platform: macOS
    sources:
      - path: PixelPulseArcade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelpulse.arcade
        PRODUCT_NAME: PixelPulse Arcade
        INFOPLIST_FILE: PixelPulseArcade/Info.plist
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "NO"
    info:
      path: PixelPulseArcade/Info.plist
